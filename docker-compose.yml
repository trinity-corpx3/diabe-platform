version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME:-app}.loadbalancer.server.port=80"
    environment:
      - APP_NAME=${APP_NAME:-Invoice Ninja}
      - APP_ENV=${APP_ENV:-production}
      - APP_KEY=${APP_KEY}
      - APP_URL=${APP_URL}
      - REACT_URL=${REACT_URL}
      - DB_HOST=${DB_HOST:-db}
      - DB_DATABASE=${DB_DATABASE:-ninja}
      - DB_USERNAME=${DB_USERNAME:-ninja}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PORT=3306
      - PDF_GENERATOR=snappdf
      - SNAPPDF_CHROMIUM_PATH=/usr/bin/chromium-browser
      - HTTPS=false
      - TRUSTED_PROXIES=*
    restart: unless-stopped
    depends_on:
      - db
    volumes:
      - storage:/var/www/app/storage
    networks:
      - app-network

  db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=${DB_DATABASE:-ninja}
      - MYSQL_USER=${DB_USERNAME:-ninja}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - mysql:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

volumes:
  storage:
  mysql:

networks:
  app-network:
    driver: bridge
